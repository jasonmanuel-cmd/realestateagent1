<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#17181a" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6f4f'/%3E%3Ctext x='50' y='70' font-size='58' font-family='system-ui,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
<title>Kern County Leads</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #666666;
    --border: #e0e0dc;
    --accent: #2f6f4f;
    --accent-text: #ffffff;
    --error: #b3261e;
    --row-hover: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --panel: #1f2123;
      --text: #eaeaea;
      --muted: #9a9a9a;
      --border: #303234;
      --accent: #4f9b73;
      --accent-text: #0d1210;
      --error: #ff6b60;
      --row-hover: #26282b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin: 0 0 28px; }

  /* --- login --- */
  #login-view {
    max-width: 340px;
    margin: 0 auto;
    min-height: calc(100vh - 96px); /* offsets .wrap's own padding so the card centers in the viewport at any screen height */
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #login-view .panel { width: 100%; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 28px; }
  #login-view h1 { text-align: center; margin-bottom: 20px; }
  #login-form { display: flex; flex-direction: column; gap: 12px; }
  input[type="password"], input[type="text"], select {
    font-size: 16px; /* keeps iOS Safari from auto-zooming the page on focus (it does this below 16px) */
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--text);
  }
  button {
    font-size: 16px;
    padding: 12px 16px;
    min-height: 44px; /* comfortable touch target */
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: 0.6; cursor: default; }
  #login-error { color: var(--error); font-size: 0.85rem; min-height: 1.2em; }

  /* --- dashboard --- */
  #dashboard-view { display: none; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type="text"] { flex: 1; min-width: 180px; }
  .toolbar select { flex-shrink: 0; }
  .meta { color: var(--muted); font-size: 0.82rem; margin-bottom: 14px; }
  #content { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  thead th {
    text-align: left;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
  }
  @media (hover: hover) {
    thead th:hover { color: var(--text); }
    tbody tr:hover { background: var(--row-hover); }
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
  tbody tr:last-child td { border-bottom: none; }
  .empty, .error-box, .loading { color: var(--muted); padding: 40px 0; text-align: center; }
  .error-box { color: var(--error); }
  .sort-indicator { opacity: 0.6; font-size: 0.75em; }

  /* Below this width, a 6-column table is unreadable -- fold each row into
     a stacked label/value card instead of forcing horizontal scroll. */
  @media (max-width: 640px) {
    table, tbody, tr { display: block; }
    thead { display: none; }
    table { border: none; background: transparent; }
    tbody tr {
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
    }
    tbody td {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    tbody td::before {
      content: attr(data-label);
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      flex-shrink: 0;
    }
  }

  @media (max-width: 480px) {
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar input[type="text"], .toolbar select, .toolbar button { width: 100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div id="login-view">
    <div class="panel">
      <h1>Kern County Leads</h1>
      <form id="login-form">
        <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus />
        <button type="submit" class="primary" id="login-btn">Sign in</button>
        <div id="login-error"></div>
      </form>
    </div>
  </div>

  <div id="dashboard-view">
    <h1>Kern County Leads</h1>
    <p class="subtitle">Vacant parcels from the daily digest pipeline. Newest first.</p>

    <div class="toolbar">
      <input type="text" id="filter" placeholder="Filter by APN, zoning, or status..." />
      <select id="sort-select" aria-label="Sort by">
        <option value="firstSeenDate:-1">Newest first</option>
        <option value="firstSeenDate:1">Oldest first</option>
        <option value="apn:1">APN (A-Z)</option>
        <option value="acreage:-1">Acreage (high-low)</option>
        <option value="acreage:1">Acreage (low-high)</option>
        <option value="zoning:1">Zoning (A-Z)</option>
        <option value="status:1">Status (A-Z)</option>
      </select>
      <button id="refresh-btn">Refresh</button>
      <button id="logout-btn">Log out</button>
    </div>

    <div class="meta" id="meta"></div>
    <div id="content"></div>
  </div>

</div>

<script>
(function () {
  var loginView = document.getElementById('login-view');
  var dashboardView = document.getElementById('dashboard-view');
  var loginForm = document.getElementById('login-form');
  var loginError = document.getElementById('login-error');
  var loginBtn = document.getElementById('login-btn');
  var passwordInput = document.getElementById('password');
  var filterInput = document.getElementById('filter');
  var sortSelect = document.getElementById('sort-select');
  var refreshBtn = document.getElementById('refresh-btn');
  var logoutBtn = document.getElementById('logout-btn');
  var contentEl = document.getElementById('content');
  var metaEl = document.getElementById('meta');

  var allLeads = [];
  var sortKey = 'firstSeenDate';
  var sortDir = -1; // newest first
  var filterTimer = null;

  var COLUMNS = [
    { key: 'apn', label: 'APN' },
    { key: 'acreage', label: 'Acreage' },
    { key: 'zoning', label: 'Zoning' },
    { key: 'status', label: 'Status' },
    { key: 'firstSeenDate', label: 'First Seen' },
    { key: 'lastSeenDate', label: 'Last Seen' }
  ];

  function showLogin() {
    loginView.style.display = 'flex'; // matches #login-view's flex centering
    dashboardView.style.display = 'none';
    passwordInput.value = '';
    passwordInput.focus();
  }

  function showDashboard() {
    loginView.style.display = 'none';
    dashboardView.style.display = 'block';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var q = filterInput.value.trim().toLowerCase();
    var rows = allLeads.filter(function (l) {
      if (!q) return true;
      return [l.apn, l.zoning, l.status].some(function (v) {
        return v && String(v).toLowerCase().indexOf(q) !== -1;
      });
    });

    rows = rows.slice().sort(function (a, b) {
      var av = a[sortKey], bv = b[sortKey];
      if (av == null) av = '';
      if (bv == null) bv = '';
      if (typeof av === 'number' && typeof bv === 'number') return (av - bv) * sortDir;
      return String(av).localeCompare(String(bv)) * sortDir;
    });

    var sortValue = sortKey + ':' + sortDir;
    var hasSortOption = Array.prototype.some.call(sortSelect.options, function (o) { return o.value === sortValue; });
    if (hasSortOption) sortSelect.value = sortValue;

    metaEl.textContent = rows.length + ' of ' + allLeads.length + ' parcels';

    if (allLeads.length === 0) {
      contentEl.innerHTML = '<div class="empty">No parcels yet. Run the digest (scheduled Vercel Cron, or `npm run digest` locally) to populate this.</div>';
      return;
    }
    if (rows.length === 0) {
      contentEl.innerHTML = '<div class="empty">No parcels match that filter.</div>';
      return;
    }

    var thead = '<thead><tr>' + COLUMNS.map(function (c) {
      var indicator = c.key === sortKey ? (sortDir === 1 ? ' <span class="sort-indicator">&uarr;</span>' : ' <span class="sort-indicator">&darr;</span>') : '';
      return '<th data-key="' + c.key + '">' + c.label + indicator + '</th>';
    }).join('') + '</tr></thead>';

    var tbody = '<tbody>' + rows.map(function (l) {
      return '<tr>' + COLUMNS.map(function (c) {
        return '<td data-label="' + escapeHtml(c.label) + '">' + escapeHtml(l[c.key]) + '</td>';
      }).join('') + '</tr>';
    }).join('') + '</tbody>';

    contentEl.innerHTML = '<table>' + thead + tbody + '</table>';

    Array.prototype.forEach.call(contentEl.querySelectorAll('thead th'), function (th) {
      th.addEventListener('click', function () {
        var key = th.getAttribute('data-key');
        if (sortKey === key) {
          sortDir = -sortDir;
        } else {
          sortKey = key;
          sortDir = 1;
        }
        render();
      });
    });
  }

  function loadLeads() {
    contentEl.innerHTML = '<div class="loading">Loading...</div>';
    return fetch('/api/leads', { credentials: 'same-origin' })
      .then(function (res) {
        if (res.status === 401) {
          showLogin();
          return null;
        }
        return res.json().then(function (body) {
          if (!res.ok) throw new Error(body.error || ('HTTP ' + res.status));
          return body;
        });
      })
      .then(function (body) {
        if (!body) return;
        allLeads = body.leads || [];
        showDashboard();
        render();
      })
      .catch(function (err) {
        showDashboard();
        contentEl.innerHTML = '<div class="error-box">Failed to load leads: ' + escapeHtml(err.message) + '</div>';
      });
  }

  loginForm.addEventListener('submit', function (e) {
    e.preventDefault();
    loginError.textContent = '';
    loginBtn.disabled = true;
    fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({ password: passwordInput.value })
    })
      .then(function (res) { return res.json().then(function (body) { return { ok: res.ok, body: body }; }); })
      .then(function (r) {
        if (!r.ok) {
          loginError.textContent = r.body.error || 'Login failed';
          return;
        }
        return loadLeads();
      })
      .catch(function (err) {
        loginError.textContent = err.message;
      })
      .finally(function () {
        loginBtn.disabled = false;
      });
  });

  filterInput.addEventListener('input', function () {
    clearTimeout(filterTimer);
    filterTimer = setTimeout(render, 120); // avoid re-rendering the whole table on every keystroke, cheap but noticeable on slower phones
  });
  sortSelect.addEventListener('change', function () {
    var parts = sortSelect.value.split(':');
    sortKey = parts[0];
    sortDir = Number(parts[1]);
    render();
  });
  refreshBtn.addEventListener('click', loadLeads);
  logoutBtn.addEventListener('click', function () {
    fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).finally(showLogin);
  });

  // On load: try the leads endpoint directly. A valid session cookie skips
  // the login form entirely; a 401 falls back to it.
  loadLeads();
})();
</script>
</body>
</html>
